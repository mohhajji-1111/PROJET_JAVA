spring.application.name=PROJET_JAVA

# Database Configuration (H2)
spring.datasource.url=jdbc:h2:mem:pedagogical_platform
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf
spring.thymeleaf.cache=false

# AI Configuration (Google Gemini)
gemini.api.key= AIzaSyB0raofed7GN4XL5AAkSM7eWi3pkAuFgB4
gemini.model=gemini-2.5-flash
gemini.temperature=0.7
gemini.max.tokens=2000

# RAG Configuration
rag.chunk.size=500
rag.chunk.overlap=100
rag.max.results=5

# Agentic AI Configuration
agent.quiz.min.questions=5
agent.quiz.max.questions=15
agent.quiz.default.questions=10
agent.difficulty.levels=EASY,MEDIUM,HARD
agent.pass.threshold=70

# Logging
logging.level.com.ensam.ma=DEBUG
logging.level.org.springframework.security=DEBUG
