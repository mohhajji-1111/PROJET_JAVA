spring.application.name=PROJET_JAVA

# ============================================
# Database Configuration (File-Based H2)
# ============================================
spring.datasource.url=jdbc:h2:file:./data/schoolDB;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================
# JPA/Hibernate Configuration
# ============================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# Thymeleaf Configuration
# ============================================
spring.thymeleaf.cache=false

# ============================================
# AI Configuration (Google Gemini)
# ============================================
gemini.api.key=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
gemini.model=gemini-1.5-flash
gemini.temperature=0.7
gemini.max-tokens=2000

# ============================================
# RAG Configuration
# ============================================
rag.chunk-size=500
rag.chunk-overlap=100
rag.max-results=5

# ============================================
# Agentic AI Configuration
# ============================================
agent.quiz.min-questions=5
agent.quiz.max-questions=15
agent.quiz.default-questions=10
agent.difficulty.levels=EASY,MEDIUM,HARD
agent.pass-threshold=70

# Time limits per difficulty (in seconds)
agent.time-limit.easy=900
agent.time-limit.medium=600
agent.time-limit.hard=300

# ============================================
# Logging Configuration
# ============================================
logging.level.com.ensam.ma=DEBUG
logging.level.org.springframework.security=INFO
