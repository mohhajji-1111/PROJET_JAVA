<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(title='Take Quiz')}"></head>
<body>
    <nav th:replace="~{layout :: navbar}"></nav>
    
    <div class="container">
        <h1 style="margin: 2rem 0 1rem;">Quiz: <span th:text="${attempt.course.title}"></span></h1>
        
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 2px solid #e5e7eb;">
                <div>
                    <span class="badge badge-info" th:text="${attempt.difficulty}">MEDIUM</span>
                    <span class="badge badge-warning" th:text="${attempt.totalQuestions} + ' Questions'">10 Questions</span>
                </div>
                <div>
                    <span style="color: #6b7280;">Started: <span th:text="${#temporals.format(attempt.startedAt, 'HH:mm')}"></span></span>
                </div>
            </div>
            
            <div class="alert alert-info">
                <strong>🤖 AI-Generated Quiz</strong><br>
                This quiz was intelligently generated by our agentic AI based on the course content. 
                All questions are derived exclusively from the material you studied.
            </div>
            
            <form th:action="@{/student/quiz/{id}/complete(id=${attempt.id})}" method="post">
                <div th:each="question, iterStat : ${attempt.questions}" style="margin-bottom: 2.5rem; padding: 1.5rem; background: #f9fafb; border-radius: 8px;">
                    <h3 style="margin-bottom: 1rem;">
                        Question <span th:text="${question.questionNumber}">1</span> of <span th:text="${attempt.totalQuestions}">10</span>
                    </h3>
                    
                    <p style="font-size: 1.1rem; font-weight: 500; margin-bottom: 1.5rem;" th:text="${question.questionText}">
                        Question text?
                    </p>
                    
                    <div th:each="option : ${question.options}" style="margin: 0.75rem 0;">
                        <label style="display: flex; align-items: center; padding: 1rem; background: white; border: 2px solid #e5e7eb; border-radius: 4px; cursor: pointer; transition: all 0.3s;">
                            <input type="radio" 
                                   th:name="'question_' + ${question.id}" 
                                   th:value="${option.optionNumber}"
                                   th:checked="${question.selectedOptionNumber != null and question.selectedOptionNumber == option.optionNumber}"
                                   required
                                   style="margin-right: 1rem;">
                            <span th:text="${option.optionText}">Option text</span>
                        </label>
                    </div>
                </div>
                
                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 2rem; padding-top: 2rem; border-top: 2px solid #e5e7eb;">
                    <a th:href="@{/student/courses/{id}(id=${attempt.course.id})}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-success" style="font-size: 1.1rem; padding: 1rem 2rem;" onclick="return confirm('Are you sure you want to submit your quiz? Make sure you have answered all questions.');">
                        Submit Quiz for AI Evaluation
                    </button>
                </div>
            </form>
        </div>
    </div>
    
    <style>
        input[type="radio"]:checked + span {
            font-weight: 600;
        }
        
        label:has(input[type="radio"]:checked) {
            border-color: #667eea;
            background: #eef2ff;
        }
        
        label:hover {
            border-color: #667eea;
        }
    </style>
</body>
</html>
