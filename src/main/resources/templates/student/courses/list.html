<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(title='My Courses')}"></head>
<body>
    <nav th:replace="~{layout :: navbar}"></nav>
    
    <div class="container">
        <h1 style="margin: 2rem 0 1rem;">My Courses</h1>
        
        <div th:replace="~{layout :: alerts}"></div>
        
        <!-- Join Course by Code Form -->
        <div class="card" style="margin-bottom: 2rem; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white;">
            <h2 style="margin-top: 0;">🔗 Join a Course</h2>
            <p style="margin-bottom: 1rem;">Enter your 6-character course code to enroll:</p>
            <form th:action="@{/student/courses/join}" method="post" style="display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;">
                <input type="text" 
                       name="enrollmentCode" 
                       placeholder="e.g., ABC123" 
                       required 
                       maxlength="6" 
                       minlength="6"
                       pattern="[A-Za-z0-9]{6}"
                       title="Please enter a valid 6-character code"
                       style="flex: 1; min-width: 150px; max-width: 200px; text-transform: uppercase; font-size: 1.2rem; letter-spacing: 0.2em; text-align: center; padding: 0.75rem; border: none; border-radius: 8px;"
                />
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn" style="background: white; color: #667eea; font-weight: bold; padding: 0.75rem 1.5rem;">
                    Join Course
                </button>
            </form>
        </div>
        
        <div th:if="${!courses.isEmpty()}" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 1.5rem;">
            <div th:each="course : ${courses}" class="card" style="margin: 0;">
                <h2 th:text="${course.title}" style="margin-top: 0;">Course Title</h2>
                <p th:text="${course.description ?: 'No description'}" style="color: #6b7280; margin: 1rem 0;">Description</p>
                
                <div style="margin: 1rem 0;">
                    <span class="badge badge-success">Published</span>
                    <span th:if="${course.indexed}" class="badge badge-info">Quiz Available</span>
                    <span th:unless="${course.indexed}" class="badge badge-warning">Quiz Not Ready</span>
                </div>
                
                <a th:href="@{/student/courses/{id}(id=${course.id})}" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
                    View Course & Take Quiz
                </a>
            </div>
        </div>
        
        <div th:if="${courses.isEmpty()}" class="card">
            <div style="text-align: center; padding: 3rem; color: #6b7280;">
                <div style="font-size: 3rem; margin-bottom: 1rem;">📚</div>
                <h2>No Courses Yet</h2>
                <p>Use the "Join a Course" form above to enroll using a course code from your teacher.</p>
            </div>
        </div>
    </div>
</body>
</html>
