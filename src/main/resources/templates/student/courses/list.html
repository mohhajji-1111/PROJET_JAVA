<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(title='My Courses')}"></head>
<body>
    <nav th:replace="~{layout :: navbar}"></nav>
    
    <div class="container">
        <h1 style="margin: 2rem 0 1rem;">My Courses</h1>
        
        <div th:replace="~{layout :: alerts}"></div>
        
        <div th:if="${!courses.isEmpty()}" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 1.5rem;">
            <div th:each="course : ${courses}" class="card" style="margin: 0;">
                <h2 th:text="${course.title}" style="margin-top: 0;">Course Title</h2>
                <p th:text="${course.description ?: 'No description'}" style="color: #6b7280; margin: 1rem 0;">Description</p>
                
                <div style="margin: 1rem 0;">
                    <span class="badge badge-success">Published</span>
                    <span th:if="${course.indexed}" class="badge badge-info">Quiz Available</span>
                    <span th:unless="${course.indexed}" class="badge badge-warning">Quiz Not Ready</span>
                </div>
                
                <a th:href="@{/student/courses/{id}(id=${course.id})}" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
                    View Course & Take Quiz
                </a>
            </div>
        </div>
        
        <div th:if="${courses.isEmpty()}" class="card">
            <div style="text-align: center; padding: 3rem; color: #6b7280;">
                <div style="font-size: 3rem; margin-bottom: 1rem;">📚</div>
                <h2>No Courses Yet</h2>
                <p>You are not enrolled in any courses. Contact your administrator to get enrolled in courses.</p>
            </div>
        </div>
    </div>
</body>
</html>
