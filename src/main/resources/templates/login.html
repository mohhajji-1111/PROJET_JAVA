<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout :: head}">
    <title>Login</title>
</head>

<body>
    <div
        style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
        <div class="card" style="max-width: 400px; width: 100%;">
            <h1 style="text-align: center; color: #667eea; margin-bottom: 2rem;">🎓 Pedagogical Platform</h1>

            <div th:if="${param.error}" class="alert alert-error">
                Invalid username or password
            </div>

            <div th:if="${param.logout}" class="alert alert-success">
                You have been logged out successfully
            </div>

            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" class="form-control" required autofocus>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Login</button>
            </form>

            <!-- Student Registration Link -->
            <div style="text-align: center; margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid #e5e7eb;">
                <p style="color: #6b7280; margin-bottom: 0.75rem;">New student?</p>
                <a th:href="@{/register}" class="btn btn-success" style="width: 100%;">
                    Create Student Account
                </a>
            </div>

            <div style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid #e5e7eb;">
                <p style="text-align: center; color: #6b7280; font-size: 0.875rem;">
                    <strong>Demo Accounts:</strong><br>
                    Admin: admin / admin<br>
                    Student: alice / alice
                </p>
            </div>
        </div>
    </div>
</body>

</html>
