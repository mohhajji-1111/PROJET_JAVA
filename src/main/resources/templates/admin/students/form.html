<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(title=${studentId != null ? 'Edit Student' : 'Add Student'})}"></head>
<body>
    <nav th:replace="~{layout :: navbar}"></nav>
    
    <div class="container">
        <h1 style="margin: 2rem 0 1rem;" th:text="${studentId != null ? 'Edit Student' : 'Add New Student'}">Student Form</h1>
        
        <div class="card">
            <form th:action="${studentId != null ? '/admin/students/' + studentId : '/admin/students'}" 
                  th:object="${userDTO}" 
                  method="post">
                
                <div class="form-group" th:if="${studentId == null}">
                    <label for="username">Username *</label>
                    <input type="text" id="username" th:field="*{username}" class="form-control" required>
                </div>
                
                <div class="form-group">
                    <label for="fullName">Full Name *</label>
                    <input type="text" id="fullName" th:field="*{fullName}" class="form-control" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" th:field="*{email}" class="form-control" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password <span th:if="${studentId != null}">(leave blank to keep current)</span></label>
                    <input type="password" id="password" th:field="*{password}" class="form-control" th:required="${studentId == null}">
                </div>
                
                <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                    <button type="submit" class="btn btn-primary">
                        <span th:text="${studentId != null ? 'Update Student' : 'Create Student'}"></span>
                    </button>
                    <a th:href="@{/admin/students}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
