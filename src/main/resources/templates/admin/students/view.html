<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(title='Student Details')}"></head>
<body>
    <nav th:replace="~{layout :: navbar}"></nav>
    
    <div class="container">
        <h1 style="margin: 2rem 0 1rem;" th:text="${student.fullName}">Student Name</h1>
        
        <div th:replace="~{layout :: alerts}"></div>
        
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <span th:if="${student.enabled}" class="badge badge-success">Active</span>
                <span th:unless="${student.enabled}" class="badge badge-danger">Inactive</span>
                
                <div style="display: flex; gap: 0.5rem;">
                    <a th:href="@{/admin/students/{id}/edit(id=${student.id})}" class="btn btn-primary">Edit</a>
                    <form th:action="@{/admin/students/{id}/delete(id=${student.id})}" method="post" style="display: inline;" onsubmit="return confirm('Are you sure you want to delete this student?');">
                        <button type="submit" class="btn btn-danger">Delete</button>
                    </form>
                </div>
            </div>
            
            <p><strong>Username:</strong> <span th:text="${student.username}"></span></p>
            <p><strong>Email:</strong> <span th:text="${student.email}"></span></p>
            <p><strong>Created at:</strong> <span th:text="${#temporals.format(student.createdAt, 'yyyy-MM-dd HH:mm')}"></span></p>
        </div>
        
        <div class="card">
            <h2>Enrolled Courses (<span th:text="${enrolledCourses.size()}">0</span>)</h2>
            
            <table th:if="${!enrolledCourses.isEmpty()}">
                <thead>
                    <tr>
                        <th>Course Title</th>
                        <th>Status</th>
                        <th>Indexed</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="course : ${enrolledCourses}">
                        <td th:text="${course.title}">Course Title</td>
                        <td>
                            <span th:if="${course.published}" class="badge badge-success">Published</span>
                            <span th:unless="${course.published}" class="badge badge-warning">Draft</span>
                        </td>
                        <td>
                            <span th:if="${course.indexed}" class="badge badge-success">✓</span>
                            <span th:unless="${course.indexed}" class="badge badge-danger">✗</span>
                        </td>
                    </tr>
                </tbody>
            </table>
            
            <div th:if="${enrolledCourses.isEmpty()}" style="text-align: center; padding: 2rem; color: #6b7280;">
                Not enrolled in any courses yet.
            </div>
        </div>
        
        <a th:href="@{/admin/students}" class="btn btn-secondary" style="margin: 1rem 0;">Back to Students</a>
    </div>
</body>
</html>
